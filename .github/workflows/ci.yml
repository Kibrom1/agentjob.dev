name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ingestion:
    name: Ingestion (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml
      - run: pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m agentjobs_ingest validate-config

  database:
    name: Schema + contract tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: pip install -e "ingestion[test]"
      - run: ./scripts/test-db.sh
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          RUN_INGEST_CONTRACT: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [app, database]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/test-e2e.sh
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
