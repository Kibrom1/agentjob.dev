name: Ingest jobs

on:
  schedule:
    # Daily at 11:15 UTC, about 2.75h before the 14:00 UTC digest cron so the
    # Monday email always reads fresh data. Off the top of the hour to avoid the rush.
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and classify only (no database writes)"
        type: boolean
        default: false
      source:
        description: "Limit to one source, e.g. ashby:langchain (optional)"
        type: string
        required: false
      force_close:
        description: "Bypass the mass-close cap (only after confirming a large drop is real)"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  # Only for the failure-notification step (opens/updates one issue).
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml
      - run: pip install -e .
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE: ${{ inputs.source }}
          FORCE_CLOSE: ${{ inputs.force_close }}
        run: |
          # --strict: a missing board (404) or any failed source fails the run, so
          # a partially broken ATS fetch is a red run, not a quiet success.
          args=(run --strict --output "$RUNNER_TEMP/ingest-summary.json")
          if [[ "$FORCE_CLOSE" == "true" ]]; then args+=(--force-close); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -n "$SOURCE" ]]; then args+=(--source "$SOURCE"); fi
          python -m agentjobs_ingest "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-summary
          path: ${{ runner.temp }}/ingest-summary.json
          if-no-files-found: ignore
      # Failure notification without any extra secret: the built-in GITHUB_TOKEN
      # opens (or comments on) a single "ingest-failure" issue, which emails the
      # repo watchers. GitHub also emails the workflow's owner on failed
      # scheduled runs. See docs/runbooks/monitoring.md.
      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: .
        run: |
          gh label create ingest-failure --color B60205 --description "Scheduled ingestion failed" 2>/dev/null || true
          existing=$(gh issue list --label ingest-failure --state open --json number --jq '.[0].number // empty')
          body="Scheduled ingestion failed: $RUN_URL"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Ingestion run failed" --label ingest-failure --body "$body"
          fi
