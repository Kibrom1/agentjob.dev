name: Agentic Roles Scheduled Tasks

# Scheduling is owned by Vercel Cron (see vercel.json). This workflow is a
# manual fallback only, so the endpoints are never triggered from two schedulers.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually"
        type: choice
        options:
          - digest
          - maintenance
        default: maintenance

concurrency:
  group: agentjob-scheduled-${{ inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.job == 'digest'
    steps:
      - name: Send digest
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/cron/digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.job == 'maintenance'
    steps:
      - name: Run maintenance
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/cron/maintenance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
