[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentjobs-ingest"
version = "1.0.0"
description = "Aggregates AI agent engineering roles from public ATS job boards into AgentJobs.dev"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "markdownify==1.2.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "respx==0.23.1",
]

[project.scripts]
agentjobs-ingest = "agentjobs_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["agentjobs_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
